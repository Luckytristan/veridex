    }

      border-bottom-color: #1D2B24;
    }

    /* Live Pulse Animation */
    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.22); }
    }
    .live-dot {
      animation: livePulse 1.8s infinite ease-in-out;
    }

    /* Audio Equalizer */
    @keyframes wave {
      0%, 100% { height: 5px; }
      50% { height: 19px; }
    }
    .eq-bar:nth-child(1) { animation: wave 0.9s infinite ease-in-out 0.1s; }

    .eq-bar:nth-child(3) { animation: wave 1.1s infinite ease-in-out 0.2s; }
    .eq-bar:nth-child(4) { animation: wave 0.8s infinite ease-in-out 0.4s; }

    /* Smooth Page Transition */
    .page-reveal {
      animation: smoothFade 0.28s cubic-bezier(0.16, 1, 0.3, 1);

    @keyframes smoothFade {
      from { opacity: 0; transform: translateY(6px); }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          return { ...getDefaultState(), ...JSON.parse(saved) };
        }
      } catch (e) {
        console.warn('State restore skipped:', e);
      }
      return getDefaultState();
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('State persist skipped:', e);
      }
    }

    // -------------------------------------------------------------------------

    // -------------------------------------------------------------------------
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-forest-900 border-copper-500 text-cream-50',
        info: 'bg-forest-900 border-gold-500 text-cream-50',
        warning: 'bg-amber-950 border-gold-500 text-cream-50'
      };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3.5 rounded-xl border-l-4 shadow-xl text-xs sm:text-sm font-medium transition-all duration-300 ${colors[type] || colors.success}`;
      toast.innerHTML = `
        <i data-lucide="check-circle-2" class="w-4 h-4 text-gold-400 shrink-0"></i>
        <span class="flex-grow">${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        setTimeout(() => toast.remove(), 280);
      }, 4000);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('modal-backdrop');
      const modalBox = document.getElementById('modal-content');
      modalBox.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    function pushNotification(title, desc) {
      state.notifications.unshift({
        id: 'N-' + Date.now(),
        title,
        desc,
        time: 'Just now',
        unread: true
      });
      saveState();
    }

    function handleSignInSubmit(e) {
      e.preventDefault();
      const identifier = document.getElementById('signin-email').value.trim();
      const role = state.authRole;

      // Preserve existing registered email if matching, or configure session from input
      const inferredName = identifier.includes('@')
        ? identifier.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, l => l.toUpperCase())
        : (role === 'lawyer' ? 'Me. Jean-Claude Habimana' : (role === 'scholar' ? 'Dr. Solange Umutoni' : 'Eric Niyonzima'));

      state.currentUser = {
        ...state.currentUser,
        name: state.currentUser.email === identifier ? state.currentUser.name : inferredName,
        email: identifier.includes('@') ? identifier : state.currentUser.email,
        phone: !identifier.includes('@') ? identifier : state.currentUser.phone,
        role
      };
      state.isAuthenticated = true;
      state.currentPage = 'home';
      saveState();
      renderApp();
      showToast(`Signed in as ${state.currentUser.name} (${role.toUpperCase()}).`);
    }

    function handleSignUpSubmit(e) {
      e.preventDefault();
      const role = state.authRole;
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const phone = document.getElementById('signup-phone').value.trim();
      const location = document.getElementById('signup-location').value;
      const extraInfo = document.getElementById('signup-extra').value.trim();
      const feeEl = document.getElementById('signup-fee');
      const fee = feeEl ? feeEl.value.trim() : '';

      state.currentUser = {
        name,
        email,
        phone,
        location,
        role,
        extraInfo,
        fee
      };

      // If registering as a Lawyer, automatically publish their profile to the live Lawyers Directory!
      if (role === 'lawyer') {
        const displayName = name.startsWith('Me.') ? name : `Me. ${name}`;
        const initials = displayName.replace(/^Me\.\s*/i, '').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase() || 'AV';
        const newId = 'law-' + Date.now();
        state.lawyers.unshift({
          id: newId,
          name: displayName,
          title: 'Registered Advocate (RBA)',
          specialization: extraInfo.includes('–') ? extraInfo.split('–')[1].trim() : extraInfo,
          qualifications: 'LL.B. (Hons), Post-Graduate Diploma in Legal Practice (ILPD)',
          experience: 6,
          district: location,
          officeAddress: `${location} Chambers, Suite 204`,
          phone,
          email,
          fee: fee || '30,000 RWF / hr',
          feeShort: (fee || '30,000 RWF').split('/')[0].trim(),
          verified: true,
          rbaNumber: extraInfo.includes('RBA') ? extraInfo.split('–')[0].trim() : 'RBA/ADV/1309',
          availability: ['Mon 10:00', 'Wed 14:00', 'Fri 11:00'],
          languages: ['Kinyarwanda', 'English', 'French'],
          bio: `Practicing advocate based in ${location}, advising clients on ${extraInfo}.`,
          initials,
          cardTone: 'from-forest-900 to-copper-700'
        });
        state.selectedLawyerIdForDashboard = newId;
      }

      state.isAuthenticated = true;
      state.currentPage = 'home';
      pushNotification(
        `Welcome to VERIDEX, ${name}`,
        `Your ${role.toUpperCase()} portal is tailored for ${location} (${extraInfo}).`
      );
      saveState();
      renderApp();
      showToast(`Account created! Welcome to VERIDEX, ${name}.`);
    }

    function filterLawyers() {
      const q = (document.getElementById('lawyer-search')?.value || '').toLowerCase();
      const spec = document.getElementById('lawyer-spec-filter')?.value || 'ALL';
      const dist = document.getElementById('lawyer-district-filter')?.value || 'ALL';
      const verifiedOnly = document.getElementById('lawyer-verified-only')?.checked || false;

      const filtered = state.lawyers.filter(l => {
        const matchesQ = l.name.toLowerCase().includes(q) || l.specialization.toLowerCase().includes(q) || l.district.toLowerCase().includes(q) || l.rbaNumber.toLowerCase().includes(q);
        const matchesSpec = spec === 'ALL' || l.specialization === spec;
        const matchesDist = dist === 'ALL' || l.district.includes(dist);
        const matchesVer = !verifiedOnly || l.verified;
        return matchesQ && matchesSpec && matchesDist && matchesVer;
      });

      const grid = document.getElementById('lawyers-grid');
      if (grid) {
        grid.innerHTML = renderLawyerCards(filtered);
        lucide.createIcons();
      }
    }

    function submitBooking(e, lawyerId) {
      e.preventDefault();
      const lawyer = state.lawyers.find(l => l.id === lawyerId);
      const newApt = {
        id: 'APT-2026-' + Math.floor(100 + Math.random() * 900),
        clientName: document.getElementById('book-name').value.trim(),
        clientEmail: state.currentUser.email,
        clientPhone: document.getElementById('book-phone').value.trim(),
        lawyerId: lawyer.id,
        lawyerName: lawyer.name,
        officeAddress: lawyer.officeAddress,
        meetingType: document.getElementById('book-type').value,
        date: document.getElementById('book-date').value,
        timeSlot: document.getElementById('book-slot').value,
        topic: document.getElementById('book-topic').value.trim(),
        status: 'Pending Lawyer Approval',
        createdAt: '2026-11-15'
      };

      state.appointments.unshift(newApt);
      pushNotification(
        'Consultation Request Sent',
        `${newApt.meetingType} with ${lawyer.name} on ${newApt.date} (${newApt.timeSlot}) is awaiting approval.`
      );
      saveState();

      openModal(`
        <div class="p-6 text-center space-y-4">
          <div class="w-12 h-12 rounded-full bg-forest-100 text-forest-800 flex items-center justify-center mx-auto">
            <i data-lucide="check-circle-2" class="w-7 h-7"></i>
          </div>
          <h3 class="font-editorial font-bold text-2xl text-forest-900">Appointment Request Confirmed</h3>
          <p class="text-sm text-slate-600 max-w-md mx-auto">
            Reference <strong class="font-code">${newApt.id}</strong> has been transmitted to <strong>${lawyer.name}</strong>.
          </p>
          <div class="p-4 rounded-xl bg-white border border-cream-300 text-left text-xs space-y-1.5 max-w-md mx-auto">
            <p><strong>Format:</strong> ${newApt.meetingType}</p>
            <p><strong>Date & Time:</strong> ${newApt.date} at ${newApt.timeSlot}</p>
            <p><strong>Office Location:</strong> ${lawyer.officeAddress}</p>
            <p><strong>Status:</strong> <span class="text-copper-700 font-bold">${newApt.status}</span></p>

          <div class="flex justify-center gap-3 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-full border border-cream-300 bg-white text-xs font-semibold">Close</button>
            <button onclick="closeModal(); navigateTo('portal')" class="px-5 py-2.5 rounded-full bg-forest-900 text-cream-50 text-xs font-semibold">Open My Portal</button>
          </div>
        </div>
      `);
      showToast('Face-to-face consultation request booked!');
    }

    function openMessageModal(lawyerId) {
      const lawyer = state.lawyers.find(l => l.id === lawyerId);
      openModal(`
        <div class="bg-forest-900 text-cream-50 px-6 py-4 flex items-center justify-between">
          <h3 class="font-editorial font-bold text-base">Direct Message to ${lawyer.name}</h3>
          <button onclick="closeModal()" class="text-cream-300 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form onsubmit="submitDirectMessage(event, '${lawyer.id}')" class="p-6 space-y-4">
          <div>
            <label class="block text-xs font-bold text-forest-900 mb-1">Subject</label>
            <input id="msg-subject" type="text" required placeholder="e.g., Consultation Fee & Document Checklist Inquiry" class="w-full px-3.5 py-2.5 rounded-xl border border-cream-300 bg-white text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-forest-900 mb-1">Message</label>
            <textarea id="msg-body" rows="4" required placeholder="Write your message to ${lawyer.name}..." class="w-full px-3.5 py-2.5 rounded-xl border border-cream-300 bg-white text-sm"></textarea>

          <div class="flex justify-end gap-3">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-full border border-cream-300 bg-white text-xs font-semibold">Cancel</button>

          </div>
        </form>
      `);
    }

    function submitDirectMessage(e, lawyerId) {
      e.preventDefault();
      const lawyer = state.lawyers.find(l => l.id === lawyerId);
      state.messages.unshift({
        id: 'MSG-' + Date.now(),
        from: state.currentUser.name,
        to: lawyer.name,
        subject: document.getElementById('msg-subject').value.trim(),
        body: document.getElementById('msg-body').value.trim(),
        timestamp: 'Just now',
        unread: false
      });
      saveState();
      closeModal();
      showToast(`Inquiry sent to ${lawyer.name}.`);
    }

    // 8. INTERIOR PAGE 3: LIVE COURT STREAMING
    // -------------------------------------------------------------------------
    function renderLiveCourtPage() {
      const activeStream = state.streams.find(s => s.id === state.activeStreamId) || state.streams[0];
      const filteredStreams = state.streamFilter === 'ALL'
        ? state.streams
        : state.streams.filter(s => s.status === state.streamFilter);

      return `
        <div class="page-reveal max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
          <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4 pb-6 border-b border-cream-300">
            <div>
              <div class="inline-flex items-center gap-2 font-code text-xs font-bold uppercase tracking-widest text-red-700">
                <span class="w-2 h-2 rounded-full bg-red-600 live-dot"></span> Judiciary Public Broadcast Center
              </div>
              <h1 class="font-editorial font-bold text-3xl sm:text-4xl text-forest-900 mt-1">Authorized Live Court Proceedings</h1>
              <p class="text-sm text-slate-600 mt-1">Watch publicly broadcast hearings approved under Rwandan judicial transparency rules.</p>
            </div>
            <div class="p-3.5 rounded-2xl bg-white border border-cream-300 text-xs text-forest-900 max-w-md flex items-start gap-2.5">
              <i data-lucide="shield-alert" class="w-4 h-4 text-copper-700 shrink-0 mt-0.5"></i>
              <span><strong>Judicial Confidentiality Rule:</strong> Juvenile proceedings, sexual offences, and protected witness testimonies are strictly excluded from public broadcast.</span>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mt-6">
            <div class="lg:col-span-8 space-y-4">
              <!-- Broadcast Screen -->
              <div class="relative rounded-2xl overflow-hidden bg-forest-950 border border-forest-800 aspect-video flex flex-col justify-between p-5 sm:p-7 text-cream-50 shadow-lg">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="flex items-center gap-2">
                    ${activeStream.status === 'LIVE'
                      ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-600 text-white font-code text-xs font-bold"><span class="w-2 h-2 rounded-full bg-white live-dot"></span> LIVE FEED</span>`
                      : `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-copper-600 text-white font-code text-xs font-bold">${activeStream.status}</span>`
                    }
                    <span class="px-3 py-1 rounded-full bg-white/10 font-code text-xs text-cream-200">
                      ${activeStream.caseNumber}
                    </span>
                  </div>
                  <span class="px-3 py-1 rounded-full bg-white/10 font-code text-xs text-cream-200 flex items-center gap-1.5">
                    <i data-lucide="eye" class="w-3.5 h-3.5 text-copper-400"></i> ${activeStream.viewers.toLocaleString()} Watching
                  </span>
                </div>

                <div class="my-auto text-center space-y-3 max-w-xl mx-auto">
                  <div class="w-14 h-14 rounded-2xl bg-white/10 border border-copper-400/40 flex items-center justify-center mx-auto text-copper-400">
                    <i data-lucide="landmark" class="w-7 h-7"></i>
                  </div>
                  <p class="font-code text-xs font-bold uppercase tracking-widest text-copper-400">${activeStream.court}</p>
                  <h2 class="font-editorial text-xl sm:text-2xl font-bold text-white leading-snug">${activeStream.caseTitle}</h2>
                  <p class="text-xs text-cream-300">${activeStream.bench}</p>

                  ${activeStream.status === 'LIVE' ? `
                    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/10 text-xs text-emerald-300 mt-2">
                      <div class="flex items-end gap-0.5 h-4">
                        <span class="w-1 bg-emerald-400 rounded eq-bar"></span>
                        <span class="w-1 bg-emerald-400 rounded eq-bar"></span>
                        <span class="w-1 bg-emerald-400 rounded eq-bar"></span>
                        <span class="w-1 bg-emerald-400 rounded eq-bar"></span>
                      </div>
                      <span>Official Courtroom Audio Feed Active (Kinyarwanda / English)</span>
                    </div>
                  ` : ''}
                </div>

                <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-white/15 text-xs text-cream-300">
                  <span><i data-lucide="map-pin" class="w-3.5 h-3.5 inline text-copper-400"></i> ${activeStream.location}</span>
                  <span class="font-code text-[11px]">${activeStream.dateTime}</span>
                </div>
              </div>

              <!-- Case Summary & Transcript -->
              <div class="bg-white rounded-2xl p-6 border border-cream-300 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <span class="font-code text-[11px] font-bold text-forest-800 bg-forest-100 px-3 py-1 rounded-full">
                      ✓ ${activeStream.authorizedBy}
                    </span>
                    <h3 class="font-editorial font-bold text-xl text-forest-900 mt-2">Proceeding Summary & Public Docket</h3>
                  </div>
                  <button onclick="downloadCaseSummary('${activeStream.id}')" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-forest-900 text-cream-50 text-xs font-semibold hover:bg-forest-800 transition">
                    <i data-lucide="download" class="w-3.5 h-3.5 text-copper-400"></i> Download Docket Notice
                  </button>
                </div>
                <p class="text-sm text-slate-600 leading-relaxed">${activeStream.summary}</p>

                <div class="border-t border-cream-200 pt-4">
                  <h4 class="font-code text-xs font-bold uppercase tracking-wider text-slate-500 mb-3 flex items-center gap-1.5">
                    <i data-lucide="subtitles" class="w-4 h-4 text-forest-900"></i> Official Courtroom Clerk Log
                  </h4>
                  ${activeStream.transcript.length > 0 ? `
                    <div class="space-y-2.5 max-h-48 overflow-y-auto pr-2">
                      ${activeStream.transcript.map(line => `
                        <div class="p-3 rounded-xl bg-cream-100 border border-cream-300 text-xs">
                          <span class="font-code font-bold text-forest-900">[${line.time}] ${line.speaker}:</span>
                          <span class="text-slate-700 ml-1">${line.text}</span>
                        </div>
                      `).join('')}
                    </div>
                  ` : `
                    <p class="text-xs text-slate-500 italic">Clerk transcript will populate automatically once the scheduled session commences.</p>
                  `}
                </div>
              </div>
            </div>

            <!-- Right Column: Schedule -->
            <div class="lg:col-span-4 space-y-4">
              <div class="bg-white rounded-2xl p-5 border border-cream-300">
                <h3 class="font-editorial font-bold text-forest-900 text-lg mb-3">Broadcast Schedule</h3>
                <div class="flex flex-wrap gap-1.5 mb-4">
                  ${['ALL', 'LIVE', 'UPCOMING', 'RECORDED'].map(tab => `
                    <button onclick="setStreamFilter('${tab}')" class="px-3 py-1 rounded-full font-code text-[11px] font-bold transition ${state.streamFilter === tab ? 'bg-forest-900 text-cream-50' : 'bg-cream-200 text-forest-900 hover:bg-cream-300'}">
                      ${tab}
                    </button>
                  `).join('')}
                </div>

                <div class="space-y-3">
                  ${filteredStreams.map(stream => {
                    const isSelected = stream.id === activeStream.id;
                    const hasReminder = state.hearingReminders.includes(stream.id);
                    return `
                      <div onclick="selectStream('${stream.id}')" class="cursor-pointer p-3.5 rounded-xl border transition ${isSelected ? 'border-copper-600 bg-copper-50' : 'border-cream-300 hover:border-forest-700 bg-white'}">
                        <div class="flex items-center justify-between gap-2 mb-1">
                          <span class="font-code text-[10px] font-bold px-2.5 py-0.5 rounded-full ${stream.status === 'LIVE' ? 'bg-red-100 text-red-700' : (stream.status === 'UPCOMING' ? 'bg-copper-100 text-copper-700' : 'bg-cream-200 text-forest-900')}">
                            ${stream.status}
                          </span>
                          <span class="font-code text-[10px] text-slate-500">${stream.caseNumber}</span>
                        </div>
                        <p class="font-bold text-xs text-forest-900 line-clamp-2 mt-1">${stream.caseTitle}</p>
                        <p class="text-[11px] text-slate-500 mt-1">${stream.court} • ${stream.dateTime}</p>
                        ${stream.status === 'UPCOMING' ? `
                          <button onclick="event.stopPropagation(); toggleHearingReminder('${stream.id}')" class="mt-2 inline-flex items-center gap-1 px-3 py-1 rounded-full text-[11px] font-semibold ${hasReminder ? 'bg-forest-100 text-forest-800' : 'bg-cream-200 text-forest-900 hover:bg-cream-300'}">
                            <i data-lucide="${hasReminder ? 'bell-ring' : 'bell-plus'}" class="w-3 h-3"></i>
                            ${hasReminder ? 'Reminder Set' : 'Remind Me'}
                          </button>
                        ` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function selectStream(streamId) {
      state.activeStreamId = streamId;
      saveState();
      renderApp();
    }

    function setStreamFilter(filter) {
      state.streamFilter = filter;
      saveState();
      renderApp();
    }

    function toggleHearingReminder(streamId) {
      const idx = state.hearingReminders.indexOf(streamId);
      const stream = state.streams.find(s => s.id === streamId);
      if (idx === -1) {
        state.hearingReminders.push(streamId);
        pushNotification('Hearing Reminder Set', `You will be alerted before ${stream.caseNumber} begins.`);
        showToast('Hearing reminder enabled.');
      } else {
        state.hearingReminders.splice(idx, 1);
        showToast('Hearing reminder removed.', 'info');
      }
      saveState();
      renderApp();
    }

    function downloadCaseSummary(streamId) {
      const s = state.streams.find(x => x.id === streamId);
      const content = `VERIDEX RWANDA - AUTHORIZED PUBLIC COURT DOCKET\n=================================================\nCourt: ${s.court}\nLocation: ${s.location}\nCase Reference: ${s.caseNumber}\nTitle: ${s.caseTitle}\nBench: ${s.bench}\nSchedule: ${s.dateTime}\nAuthorization: ${s.authorizedBy}\n\nSummary:\n${s.summary}`;
      triggerTextDownload(`${s.caseNumber.replace(/\//g, '_')}_Docket.txt`, content);
    }

    // -------------------------------------------------------------------------
    // 9. INTERIOR PAGE 4: RWANDA GAZETTE & LEGAL LIBRARY
    // -------------------------------------------------------------------------
    function renderGazettePage() {
      return `
        <div class="page-reveal max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
          <div class="pb-6 border-b border-cream-300 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
              <span class="font-code text-xs font-bold uppercase tracking-widest text-copper-700">Official Legislation & Research Repository</span>
              <h1 class="font-editorial font-bold text-3xl sm:text-4xl text-forest-900 mt-1">Rwanda Official Gazette & Legal Library</h1>
              <p class="text-sm text-slate-600 mt-1">Search, filter, read, cite, and download consolidated Rwandan laws and constitutional decrees.</p>
            </div>
            ${state.currentUser.role === 'scholar' ? `
              <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-forest-900 text-gold-400 font-code text-xs font-semibold">
                <i data-lucide="graduation-cap" class="w-4 h-4"></i> Scholar Citation Mode Active
              </span>
            ` : ''}
          </div>

          <div class="bg-white rounded-2xl p-4 border border-cream-300 mt-6 flex flex-col md:flex-row gap-3">
            <div class="relative flex-grow">
              <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
              <input id="gazette-search" oninput="filterGazettes()" type="text" placeholder="Search by law number (e.g., 68/2018), title, or keyword..." class="w-full pl-10 pr-3 py-2 rounded-xl border border-cream-300 bg-cream-50 text-sm focus:outline-none focus:border-forest-900" />
            </div>
            <select id="gazette-cat-filter" onchange="filterGazettes()" class="px-3.5 py-2 rounded-xl border border-cream-300 text-sm text-forest-900 bg-cream-50">
              <option value="ALL">All Categories</option>
              <option value="Constitutional">Constitutional</option>
              <option value="Criminal Law">Criminal Law</option>
              <option value="Land & Property">Land & Property</option>
              <option value="Labor & Employment">Labor & Employment</option>
              <option value="Family & Succession">Family & Succession</option>
              <option value="Digital & Privacy">Digital & Privacy</option>
            </select>
            <select id="gazette-year-filter" onchange="filterGazettes()" class="px-3.5 py-2 rounded-xl border border-cream-300 text-sm text-forest-900 bg-cream-50">
              <option value="ALL">All Years</option>
              <option value="2021">2021</option>
              <option value="2018">2018</option>
              <option value="2016">2016</option>
              <option value="2015">2015</option>
            </select>
          </div>

          <div id="gazette-list" class="space-y-4 mt-6">
            ${renderGazetteCards(state.gazettes)}
          </div>
        </div>
      `;
    }

    function renderGazetteCards(list) {
      if (list.length === 0) {
        return `<div class="bg-white rounded-2xl p-10 text-center border border-cream-300 text-slate-500 text-sm">No matching Gazette laws found.</div>`;
      }

      return list.map(law => {
        const isBookmarked = state.bookmarkedLaws.includes(law.id);
        return `
          <div class="bg-white rounded-2xl p-6 border border-cream-300 hover:border-copper-600 transition shadow-sm">
            <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-4">
              <div class="space-y-2 max-w-3xl">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="px-3 py-0.5 rounded-full bg-forest-900 text-cream-50 font-code text-xs font-bold">${law.fullCode}</span>
                  <span class="px-3 py-0.5 rounded-full bg-cream-200 text-forest-900 text-xs font-semibold">${law.category}</span>
                  <span class="px-3 py-0.5 rounded-full bg-forest-100 text-forest-800 text-xs font-semibold">${law.status}</span>
                </div>
                <h3 class="font-editorial font-bold text-xl text-forest-900">${law.title}</h3>
                <p class="font-code text-xs text-slate-500">${law.number}</p>
                <p class="text-sm text-slate-600 leading-relaxed pt-1">${law.summary}</p>
              </div>

              <div class="flex flex-wrap lg:flex-col gap-2 shrink-0">
                <button onclick="openGazetteReader('${law.id}')" class="inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-full bg-copper-600 hover:bg-forest-900 text-white text-xs font-semibold transition">
                  <i data-lucide="book-open" class="w-4 h-4"></i> Read & Cite
                </button>
                <button onclick="downloadGazetteLaw('${law.id}')" class="inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-full border border-cream-300 bg-cream-50 hover:bg-cream-200 text-forest-900 text-xs font-semibold transition">
                  <i data-lucide="download" class="w-4 h-4"></i> Download Text
                </button>
                <button onclick="toggleBookmarkLaw('${law.id}')" class="inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-full border text-xs font-semibold transition ${isBookmarked ? 'border-copper-600 bg-copper-50 text-copper-700' : 'border-cream-300 text-slate-600 hover:text-forest-900'}">
                  <i data-lucide="bookmark" class="w-3.5 h-3.5"></i> ${isBookmarked ? 'Saved' : 'Save Law'}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterGazettes() {
      const q = (document.getElementById('gazette-search')?.value || '').toLowerCase();
      const cat = document.getElementById('gazette-cat-filter')?.value || 'ALL';
      const yr = document.getElementById('gazette-year-filter')?.value || 'ALL';

      const filtered = state.gazettes.filter(g => {
        const matchQ = g.title.toLowerCase().includes(q) || g.fullCode.toLowerCase().includes(q) || g.summary.toLowerCase().includes(q);
        const matchCat = cat === 'ALL' || g.category === cat;
        const matchYr = yr === 'ALL' || g.year === yr;
        return matchQ && matchCat && matchYr;
      });

      const container = document.getElementById('gazette-list');
      if (container) {
        container.innerHTML = renderGazetteCards(filtered);
        lucide.createIcons();
      }
    }

    function openGazetteReader(lawId) {
      const law = state.gazettes.find(g => g.id === lawId);
      if (!law) return;
      openModal(`
        <div class="bg-forest-900 text-cream-50 px-6 py-4 flex items-center justify-between">
          <div>
            <p class="font-code text-xs text-copper-400 font-bold">${law.number}</p>
            <h3 class="font-editorial font-bold text-lg">${law.fullCode}</h3>
          </div>
          <button onclick="closeModal()" class="text-cream-300 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="p-6 space-y-5 max-h-[75vh] overflow-y-auto">
          <div>
            <h4 class="font-editorial font-bold text-forest-900 text-xl">${law.title}</h4>
            <p class="text-sm text-slate-600 mt-2 leading-relaxed">${law.summary}</p>
          </div>

          <!-- Academic Citation Box -->
          <div class="p-4 rounded-xl bg-white border border-cream-300 space-y-2">
            <div class="flex items-center justify-between">
              <span class="font-code text-[11px] font-bold uppercase tracking-wider text-forest-900">Academic & Legal Citation</span>
              <button onclick="copyCitationText('${law.citation.replace(/'/g, "\\'")}')" class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-forest-900 text-cream-50 font-code text-[11px] font-semibold">
                <i data-lucide="copy" class="w-3 h-3 text-copper-400"></i> Copy Citation
              </button>
            </div>
            <p class="font-code text-xs text-slate-700 bg-cream-100 p-3 rounded-lg border border-cream-300">${law.citation}</p>
          </div>

          <div class="p-4 rounded-xl bg-copper-50 border border-copper-500/30">
            <h5 class="font-code text-xs font-bold uppercase tracking-wider text-copper-700 mb-2">Key Statutory Provisions</h5>
            <ul class="space-y-1.5 text-xs text-forest-900 list-disc pl-4">
              ${law.keyArticles.map(art => `<li>${art}</li>`).join('')}
            </ul>
          </div>

          <div>
            <h5 class="font-code text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Official Gazette Excerpt</h5>
            <pre class="p-4 rounded-xl bg-forest-950 text-cream-100 text-xs font-code whitespace-pre-wrap leading-relaxed">${law.fullText}</pre>
          </div>

          <div class="flex justify-end gap-3 pt-2 border-t border-cream-300">
            <button onclick="closeModal()" class="px-4 py-2 rounded-full border border-cream-300 bg-white text-xs font-semibold">Close Reader</button>
            <button onclick="downloadGazetteLaw('${law.id}')" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-copper-600 text-white text-xs font-semibold">
              <i data-lucide="download" class="w-4 h-4"></i> Download Official Copy
            </button>
          </div>
        </div>
      `);
    }

    function copyCitationText(text) {
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast('Statutory citation copied to clipboard.');
    }

    function downloadGazetteLaw(lawId) {
      const law = state.gazettes.find(g => g.id === lawId);
      const content = `${law.number}\n${law.fullCode}: ${law.title}\nCategory: ${law.category} | Status: ${law.status}\n============================================================\n\nCITATION:\n${law.citation}\n\nPLAIN LANGUAGE SUMMARY:\n${law.summary}\n\nKEY PROVISIONS:\n${law.keyArticles.map(a => '- ' + a).join('\n')}\n\nOFFICIAL TEXT:\n${law.fullText}`;
      triggerTextDownload(`${law.lawCode.replace(/[^a-zA-Z0-9]/g, '_')}.txt`, content);
    }

    function toggleBookmarkLaw(lawId) {
      const idx = state.bookmarkedLaws.indexOf(lawId);
      if (idx === -1) {
        state.bookmarkedLaws.push(lawId);
        showToast('Legislation saved to My Portal.');
      } else {
        state.bookmarkedLaws.splice(idx, 1);
        showToast('Removed from saved laws.', 'info');
      }
      saveState();
      renderApp();
    }

    function triggerTextDownload(filename, text) {
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Downloaded ${filename}`);
    }

    function filterSchedules() {
      const q = (document.getElementById('schedule-search')?.value || '').toLowerCase();

        const mQ = s.caseNumber.toLowerCase().includes(q) || s.court.toLowerCase().includes(q) || s.partiesPublic.toLowerCase().includes(q) || s.provision.toLowerCase().includes(q);

        return mQ && mC;
      });
      const tbody = document.getElementById('schedules-tbody');
      if (tbody) tbody.innerHTML = renderScheduleRows(filtered);

    function filterConvictions() {

                      <span class="font-code text-[11px] text-slate-400">${m.timestamp}</span>
                    </div>
                    <p class="text-xs font-semibold text-copper-700">${m.subject}</p>
                    <p class="text-xs text-slate-700 mt-1.5 leading-relaxed">${m.body}</p>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function cancelAppointment(aptId) {
      state.appointments = state.appointments.filter(a => a.id !== aptId);
      saveState();
      renderApp();
      showToast(`Appointment ${aptId} cancelled.`, 'info');
    }

    function renderLawyerPortalBody() {
      const activeLawyer = state.lawyers.find(l => l.id === state.selectedLawyerIdForDashboard) || state.lawyers[0];
      const lawyerAppointments = state.appointments.filter(a => a.lawyerId === activeLawyer.id || state.selectedLawyerIdForDashboard === 'ALL');

      return `
        <div class="space-y-6">
          <div class="bg-white rounded-2xl p-5 border border-cream-300 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-sm">
            <div>
              <p class="font-code text-xs font-bold uppercase text-copper-700">Managing Chambers As:</p>
              <h3 class="font-editorial font-bold text-xl text-forest-900">${activeLawyer.name} (${activeLawyer.rbaNumber})</h3>
              <p class="text-xs text-slate-500">${activeLawyer.officeAddress}</p>
            </div>
            <select onchange="selectDashboardLawyer(this.value)" class="px-4 py-2.5 rounded-full border border-cream-300 text-xs font-semibold bg-cream-50 text-forest-900">
              ${state.lawyers.map(l => `<option value="${l.id}" ${l.id === activeLawyer.id ? 'selected' : ''}>${l.name}</option>`).join('')}
              <option value="ALL" ${state.selectedLawyerIdForDashboard === 'ALL' ? 'selected' : ''}>All Advocates' Requests</option>
            </select>
          </div>

          <div class="bg-white rounded-2xl p-6 border border-cream-300 shadow-sm">
            <h3 class="font-editorial font-bold text-xl text-forest-900 mb-4">Incoming Face-to-Face & Video Consultation Requests (${lawyerAppointments.length})</h3>
            ${lawyerAppointments.length === 0 ? `
              <p class="text-sm text-slate-500 py-6 text-center">No appointment requests for this advocate yet.</p>
            ` : `
              <div class="space-y-3">
                ${lawyerAppointments.map(apt => `
                  <div class="p-4 rounded-xl border border-cream-300 bg-cream-50 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="space-y-1">
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="font-code text-xs font-bold text-forest-900">${apt.id}</span>
                        <span class="px-2.5 py-0.5 rounded-full font-code text-[11px] font-bold ${apt.status === 'Confirmed' ? 'bg-forest-100 text-forest-800' : (apt.status === 'Declined' ? 'bg-red-100 text-red-700' : 'bg-copper-100 text-copper-700')}">
                          ${apt.status}
                        </span>
                        <span class="text-xs font-semibold text-forest-800">• ${apt.meetingType}</span>
                      </div>
                      <p class="font-bold text-sm text-forest-900">Client: ${apt.clientName} (${apt.clientPhone})</p>
                      <p class="text-xs text-slate-600"><strong>Requested Slot:</strong> ${apt.date} at ${apt.timeSlot}</p>
                      <p class="text-xs text-slate-700 mt-1"><strong>Client Brief:</strong> ${apt.topic}</p>
                    </div>
                    <div class="flex flex-wrap gap-2 shrink-0">
                      <button onclick="updateAppointmentStatus('${apt.id}', 'Confirmed')" class="px-4 py-2 rounded-full bg-forest-800 hover:bg-forest-900 text-white text-xs font-semibold transition">
                        ✓ Accept Meeting
                      </button>
                      <button onclick="updateAppointmentStatus('${apt.id}', 'Declined')" class="px-4 py-2 rounded-full border border-red-300 bg-white hover:bg-red-50 text-red-700 text-xs font-semibold transition">
                        Decline
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function selectDashboardLawyer(id) {
      state.selectedLawyerIdForDashboard = id;
      saveState();
      renderApp();
    }

    function updateAppointmentStatus(aptId, newStatus) {
      const apt = state.appointments.find(a => a.id === aptId);
      if (!apt) return;
      apt.status = newStatus;
      pushNotification(
        `Consultation ${newStatus}`,
        `${apt.lawyerName} has ${newStatus.toLowerCase()} appointment ${apt.id} (${apt.date} at ${apt.timeSlot}).`
      );
      saveState();
      renderApp();
      showToast(`Appointment ${apt.id} marked as ${newStatus}.`);
    }

    function renderScholarPortalBody() {
      const user = state.currentUser;
      const savedLaws = state.gazettes.filter(g => state.bookmarkedLaws.includes(g.id));

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div class="lg:col-span-4 space-y-6">
            <div class="bg-white rounded-2xl p-6 border border-cream-300 space-y-4 shadow-sm">
              <div class="flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-full bg-forest-900 text-gold-400 flex items-center justify-center">
                  <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                </div>
                <div>
                  <h3 class="font-editorial font-bold text-lg text-forest-900">${user.name}</h3>
                  <p class="text-xs text-copper-700 font-semibold">Legal Scholar & Researcher</p>
                </div>
              </div>
              <div class="text-xs text-slate-600 space-y-2 pt-3 border-t border-cream-200">
                <p><strong>Email:</strong> ${user.email}</p>
                <p><strong>Location:</strong> ${user.location}</p>
                <p><strong>Institution / Focus:</strong> ${user.extraInfo || 'University of Rwanda – School of Law'}</p>
              </div>
            </div>

            <div class="bg-white rounded-2xl p-6 border border-cream-300 shadow-sm">
              <h3 class="font-editorial font-bold text-lg text-forest-900 mb-3">Add Research Note</h3>
              <form onsubmit="addScholarNote(event)" class="space-y-3">
                <input id="res-title" type="text" required placeholder="Note Title (e.g., Land Title Transfer Jurisprudence)" class="w-full px-3.5 py-2 rounded-xl border border-cream-300 bg-cream-50 text-xs" />
                <input id="res-law" type="text" required placeholder="Cited Statute / Case (e.g., Law N° 27/2021)" class="w-full px-3.5 py-2 rounded-xl border border-cream-300 bg-cream-50 font-code text-xs" />
                <textarea id="res-body" rows="3" required placeholder="Write analytical observations..." class="w-full px-3.5 py-2 rounded-xl border border-cream-300 bg-cream-50 text-xs"></textarea>
                <button type="submit" class="w-full py-2.5 rounded-full bg-copper-600 hover:bg-forest-900 text-white text-xs font-bold transition">
                  Save Research Note
                </button>
              </form>
            </div>
          </div>

          <div class="lg:col-span-8 space-y-6">
            <div class="bg-white rounded-2xl p-6 border border-cream-300 shadow-sm">
              <h3 class="font-editorial font-bold text-xl text-forest-900 mb-4">Jurisprudential Research Notebook (${state.researchNotes.length})</h3>
              <div class="space-y-3">
                ${state.researchNotes.map(note => `
                  <div class="p-4 rounded-xl bg-cream-50 border border-cream-300 space-y-1.5">
                    <div class="flex items-center justify-between gap-2">
                      <span class="font-code text-[11px] font-bold text-copper-700">${note.lawRef}</span>
                      <span class="font-code text-[10px] text-slate-400">${note.updatedAt}</span>
                    </div>
                    <h4 class="font-editorial font-bold text-base text-forest-900">${note.title}</h4>
                    <p class="text-xs text-slate-700 leading-relaxed">${note.note}</p>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="bg-white rounded-2xl p-6 border border-cream-300 shadow-sm">
              <h3 class="font-editorial font-bold text-xl text-forest-900 mb-3">Saved Statutes & Formal Citations</h3>
              <div class="space-y-3">
                ${savedLaws.map(law => `
                  <div class="p-4 rounded-xl bg-cream-100 border border-cream-300 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <p class="font-code text-xs font-bold text-forest-900">${law.fullCode}</p>
                      <p class="text-xs text-slate-600 mt-0.5">${law.citation}</p>
                    </div>
                    <button onclick="copyCitationText('${law.citation.replace(/'/g, "\\'")}')" class="px-4 py-1.5 rounded-full bg-forest-900 text-cream-50 font-code text-[11px] font-semibold shrink-0">
                      Copy Citation
                    </button>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function addScholarNote(e) {
      e.preventDefault();
      state.researchNotes.unshift({
        id: 'RES-' + Date.now(),
        title: document.getElementById('res-title').value.trim(),
        lawRef: document.getElementById('res-law').value.trim(),
        note: document.getElementById('res-body').value.trim(),
        updatedAt: 'Nov 15, 2026'
      });
      saveState();
      renderApp();
      showToast('Research note saved.');
    }

    function openQuickSearchModal() {
      openModal(`
        <div class="bg-forest-900 text-cream-50 px-6 py-4 flex items-center justify-between">
          <h3 class="font-editorial font-bold text-base">Quick Search Across VERIDEX</h3>
          <button onclick="closeModal()" class="text-cream-300 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="p-6 space-y-4">
          <p class="text-xs text-slate-600">Jump directly to verified advocates, Official Gazette laws, or court schedules:</p>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
            <button onclick="closeModal(); navigateTo('lawyers')" class="p-3 rounded-xl bg-white border border-cream-300 hover:border-copper-600 text-xs font-bold text-forest-900">Advocates Directory</button>
            <button onclick="closeModal(); navigateTo('gazette')" class="p-3 rounded-xl bg-white border border-cream-300 hover:border-copper-600 text-xs font-bold text-forest-900">Official Gazette</button>
            <button onclick="closeModal(); navigateTo('courts')" class="p-3 rounded-xl bg-white border border-cream-300 hover:border-copper-600 text-xs font-bold text-forest-900">Court Schedules</button>
          </div>
        </div>
      `);
    }

    // -------------------------------------------------------------------------
    // 13. MAIN RENDER CONTROLLER
    // -------------------------------------------------------------------------
    function renderApp() {
      const shell = document.getElementById('app-shell');
      if (!shell) return;

      if (!state.isAuthenticated) {
        shell.innerHTML = renderAuthGateway();
      } else {
        shell.innerHTML = renderInteriorShell();
      }

      lucide.createIcons();
    }

    document.addEventListener('click', (e) => {
      const dd = document.getElementById('notif-dropdown');
      if (dd && !dd.classList.contains('hidden')) {
        if (!e.target.closest('#notif-dropdown') && !e.target.closest('button[aria-label="Notifications"]')) {
          dd.classList.add('hidden');
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
